name: CI and Deploy to VM

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  ci:
    name: Code & Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        working-directory: backend
        run: |
          python -m compileall main.py script.py script_transformer.py

  deploy:
    name: Deploy to Local VM
    runs-on: self-hosted
    needs: ci
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    steps:
      - name: Pull Latest Changes and Restart App
        run: |
          set -e
          DEPLOY_PATH="${{ secrets.VM_DEPLOY_PATH }}"
          if [ -z "$DEPLOY_PATH" ]; then
            DEPLOY_PATH="$HOME/Orchevo_Script_Application"
          fi

          echo "Deploying in $DEPLOY_PATH..."
          cd "$DEPLOY_PATH"

          # Determine branch
          CURRENT_BRANCH="${GITHUB_REF##*/}"
          git fetch origin "$CURRENT_BRANCH"
          git checkout "$CURRENT_BRANCH"
          git pull --ff-only origin "$CURRENT_BRANCH"

          # Update python dependencies
          if [ -d "venv" ]; then
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r backend/requirements.txt
          fi

          # Restart the systemd service
          sudo systemctl restart chatbot

          # Health check status
          sleep 2
          if sudo systemctl is-active --quiet chatbot; then
            echo "Chatbot service restarted successfully!"
          else
            echo "Chatbot service failed to start!"
            sudo journalctl -u chatbot -n 30 --no-pager
            exit 1
          fi
